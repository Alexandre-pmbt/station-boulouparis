<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Station MOBIL Boulouparis · Gestion</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Station">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Barre du haut (enseigne, mois, compte), onglets, puis un plan de travail par onglet : tableaux denses et indicateurs. */
:root{
  --bg:#f2f4f7; --surface:#fff; --ink:#14202e; --muted:#5b6878; --line:#d8dee6; --soft:#eaeef3;
  --accent:#1f4e8c; --accent-2:#d2232a; --accent-ink:#fff; --accent-soft:#dde7f4;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b3261e; --bad-soft:#fbe1df;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141b; --surface:#151e28; --ink:#e3e9ef; --muted:#93a1b0; --line:#26323f; --soft:#1b2632;
  --accent:#6fa3e6; --accent-2:#ef6b6f; --accent-ink:#0a1a2e; --accent-soft:#1a2c44;
  --ok:#5cc98a; --ok-soft:#173527; --warn:#e2b04f; --warn-soft:#3a2f14; --bad:#f08a82; --bad-soft:#3d1c1a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#app{max-width:1240px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
main{display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between;border-top:4px solid var(--accent-2);padding-top:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.brand h1{margin:0;font-size:20px;letter-spacing:-.01em}.brand span{color:var(--muted);font-size:13px}
.ctx{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--f-num);text-align:right}
input.err{border-color:var(--bad);background:var(--bad-soft)}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button,.btn{font:inherit;cursor:pointer;border-radius:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}button.link.danger{color:var(--bad)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav.subtabs button{border-radius:999px;padding:5px 12px;font-size:13px}
nav.subtabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
#vue{display:flex;flex-direction:column;gap:14px}#sv{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flat{border:none;padding:0}
.panel h2,.modal h2{margin:0;font-size:15px;font-weight:650}
h3{margin:4px 0 0;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.end{justify-content:flex-end}.grow{flex:1 1 auto}.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:12.5px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.mono{font-family:var(--f-num)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
th.num{text-align:right}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.total td{font-weight:700;background:var(--soft)}tr.bad td{color:var(--bad);font-weight:600}
td input{width:100%}td.actions{display:flex;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:var(--f-body)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--accent-soft);color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{background:var(--warn-soft);border-radius:6px;padding:7px 10px;font-size:13px}.alerts li.bad{background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px}
.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:var(--warn)}.kpi.ok{border-left-color:var(--ok)}
.kpi-t{font-size:12px;color:var(--muted);font-weight:600}.kpi-v{font-size:20px;font-weight:700;text-align:left;margin:2px 0}.kpi-s{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.form.one{grid-template-columns:1fr}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}.form label.wide{grid-column:1/-1}
details.grp{border:1px solid var(--line);border-radius:6px;padding:6px 10px}details.grp summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.grp summary .num{margin-left:auto}details.grp table{margin-top:6px}
.chart{width:100%;height:auto}.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:10px;width:min(620px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal.large{width:min(1000px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--soft);padding:10px;border-radius:6px}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,90vw)}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}
.login{max-width:420px;margin:10vh auto}.login h1{margin:0;font-size:20px}
.planning td input{min-width:84px;font-family:var(--f-num);font-size:12.5px}
@media print{header.top .ctx,nav,.noprint,#sp,#sn,#pcopy,#psave,#pprint,.subtabs{display:none!important}body{background:#fff}.panel{border:none}}
</style>
</head>
<body>
<div id="app"><div class="panel muted">Chargement…</div></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="supabase-config.js"></script>
<script src="compta.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
